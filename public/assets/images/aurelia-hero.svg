<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Aurelia Residences on the harbour</title>
  <desc id="desc">Stylised architectural rendering of a layered stone and glass residential building with deep planted loggias above a harbour at twilight.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39434c"/>
      <stop offset=".5" stop-color="#7b7f83"/>
      <stop offset=".82" stop-color="#c7a894"/>
      <stop offset="1" stop-color="#e0c7ac"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d6b6d"/>
      <stop offset=".6" stop-color="#3f4d50"/>
      <stop offset="1" stop-color="#2c3a3d"/>
    </linearGradient>
    <linearGradient id="facade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7c8b4"/>
      <stop offset=".5" stop-color="#bfae99"/>
      <stop offset="1" stop-color="#9c8b78"/>
    </linearGradient>
    <linearGradient id="facadeShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f7e6c"/>
      <stop offset="1" stop-color="#c3b29c"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#425856"/>
      <stop offset="1" stop-color="#263936"/>
    </linearGradient>
    <radialGradient id="warm" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd9a4" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffd9a4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".45" r=".8">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b1012" stop-opacity=".5"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".055"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="1210" cy="470" r="30" fill="#ffe1b1" opacity=".6" filter="url(#soft)"/>

  <!-- distant shore -->
  <path d="M0 560 L140 540 L300 566 L470 544 L640 572 L820 552 L1000 578 L1200 556 L1370 580 L1600 560 L1600 640 L0 640 Z" fill="#6d7474" opacity=".7"/>
  <g fill="#8a8d86" opacity=".55">
    <rect x="880" y="534" width="10" height="42"/><rect x="900" y="520" width="16" height="56"/><rect x="930" y="540" width="8" height="36"/>
    <rect x="1080" y="526" width="12" height="48"/><rect x="1100" y="512" width="22" height="62"/><rect x="1132" y="538" width="8" height="36"/>
  </g>

  <!-- water -->
  <rect y="596" width="1600" height="404" fill="url(#water)"/>
  <g stroke="#d8c0a4" stroke-width="1.5" opacity=".22">
    <path d="M0 640 H1600"/><path d="M0 680 H1600"/><path d="M0 730 H1600"/><path d="M0 792 H1600"/><path d="M0 864 H1600"/><path d="M0 946 H1600"/>
  </g>
  <ellipse cx="1190" cy="620" rx="260" ry="20" fill="#f3d4ad" opacity=".3" filter="url(#soft)"/>

  <!-- building -->
  <path d="M300 268 L1070 268 L1150 1000 L220 1000 Z" fill="#403f3a" opacity=".35" filter="url(#soft)"/>
  <rect x="340" y="300" width="760" height="580" fill="url(#facade)"/>

  <!-- level bands / loggias -->
  <g>
    <!-- roof -->
    <rect x="320" y="286" width="800" height="24" fill="#e3d6c3"/>
    <rect x="320" y="310" width="800" height="8" fill="#93826f"/>
    <!-- level 3 -->
    <rect x="340" y="318" width="760" height="120" fill="url(#glass)"/>
    <g fill="url(#facadeShade)">
      <rect x="340" y="318" width="760" height="22"/>
      <rect x="340" y="318" width="26" height="120"/><rect x="640" y="318" width="18" height="120"/><rect x="940" y="318" width="18" height="120"/>
    </g>
    <g fill="#cfc0ab">
      <rect x="374" y="386" width="242" height="34"/>
      <rect x="674" y="386" width="242" height="34"/>
      <rect x="974" y="386" width="112" height="34"/>
    </g>
    <g fill="#4d6350" opacity=".9">
      <ellipse cx="400" cy="384" rx="30" ry="15"/><ellipse cx="470" cy="382" rx="20" ry="12"/><ellipse cx="540" cy="384" rx="26" ry="14"/>
      <ellipse cx="700" cy="384" rx="26" ry="14"/><ellipse cx="770" cy="382" rx="20" ry="12"/><ellipse cx="1000" cy="384" rx="28" ry="14"/>
    </g>
    <!-- level 2 -->
    <rect x="340" y="438" width="760" height="120" fill="url(#glass)"/>
    <rect x="340" y="438" width="760" height="18" fill="#dccfbb"/>
    <g fill="url(#facadeShade)">
      <rect x="340" y="438" width="26" height="120"/><rect x="640" y="438" width="18" height="120"/><rect x="940" y="438" width="18" height="120"/>
    </g>
    <g fill="#cdbda7">
      <rect x="374" y="506" width="242" height="34"/><rect x="674" y="506" width="242" height="34"/><rect x="974" y="506" width="112" height="34"/>
    </g>
    <g fill="#4b6352" opacity=".85">
      <ellipse cx="430" cy="504" rx="30" ry="15"/><ellipse cx="730" cy="504" rx="28" ry="14"/><ellipse cx="1010" cy="504" rx="26" ry="14"/>
    </g>
    <g fill="#f2c98f" opacity=".55">
      <rect x="404" y="454" width="84" height="26"/><rect x="720" y="454" width="120" height="26"/><rect x="1010" y="458" width="60" height="22"/>
    </g>
    <!-- level 1 -->
    <rect x="340" y="558" width="760" height="120" fill="url(#glass)"/>
    <rect x="340" y="558" width="760" height="18" fill="#dccfbb"/>
    <g fill="url(#facadeShade)">
      <rect x="340" y="558" width="26" height="120"/><rect x="640" y="558" width="18" height="120"/><rect x="940" y="558" width="18" height="120"/>
    </g>
    <g fill="#cdbda7">
      <rect x="374" y="626" width="242" height="34"/><rect x="674" y="626" width="242" height="34"/><rect x="974" y="626" width="112" height="34"/>
    </g>
    <g fill="#466050" opacity=".9">
      <ellipse cx="470" cy="624" rx="34" ry="16"/><ellipse cx="760" cy="624" rx="30" ry="15"/><ellipse cx="1020" cy="624" rx="24" ry="13"/>
    </g>
    <g fill="#f7d49b" opacity=".6">
      <rect x="392" y="574" width="150" height="30"/><rect x="690" y="574" width="92" height="30"/><rect x="964" y="578" width="120" height="26"/>
    </g>
    <!-- ground / lobby -->
    <rect x="340" y="678" width="760" height="120" fill="url(#facade)"/>
    <g stroke="#9c8b77" stroke-width="1.5" opacity=".7">
      <path d="M340 710 H1100"/><path d="M340 742 H1100"/><path d="M340 774 H1100"/>
      <path d="M430 678 V798"/><path d="M540 678 V798"/><path d="M650 678 V798"/><path d="M760 678 V798"/><path d="M870 678 V798"/><path d="M980 678 V798"/>
    </g>
    <rect x="700" y="710" width="180" height="88" fill="#2c3b38"/>
    <rect x="716" y="724" width="148" height="60" fill="#c99b63" opacity=".45"/>
    <circle cx="790" cy="754" r="34" fill="url(#warm)"/>
  </g>
  <!-- bronze soffits -->
  <g fill="#7a5b3d">
    <rect x="360" y="418" width="740" height="5" opacity=".55"/>
    <rect x="360" y="538" width="740" height="5" opacity=".55"/>
    <rect x="360" y="658" width="740" height="5" opacity=".55"/>
  </g>
  <!-- entry canopy -->
  <rect x="720" y="806" width="320" height="16" fill="#3d3a33"/>
  <rect x="744" y="822" width="8" height="64" fill="#3d3a33"/><rect x="1008" y="822" width="8" height="64" fill="#3d3a33"/>

  <!-- landscape foreground -->
  <path d="M0 1000 L0 880 C180 860 360 900 520 1000 Z" fill="#2e3a31"/>
  <path d="M1600 1000 L1600 856 C1440 842 1280 894 1180 1000 Z" fill="#2b3730"/>
  <g stroke="#2a352c" stroke-width="5" fill="none">
    <path d="M120 1000 V800"/><path d="M180 1000 V820"/><path d="M240 1000 V846"/>
    <path d="M120 840 q-46 -20 -60 -60"/><path d="M180 852 q48 -26 56 -66"/><path d="M240 870 q42 -18 54 -54"/>
  </g>
  <g fill="#465545">
    <ellipse cx="110" cy="810" rx="70" ry="34"/><ellipse cx="200" cy="832" rx="58" ry="28"/><ellipse cx="150" cy="780" rx="48" ry="24"/>
  </g>
  <g stroke="#3f4b3d" stroke-width="4" fill="none" opacity=".9">
    <path d="M1400 1000 V850"/><path d="M1460 1000 V820"/><path d="M1520 1000 V866"/>
    <path d="M1400 884 q-38 -18 -50 -56"/><path d="M1460 856 q42 -22 52 -62"/>
  </g>

  <!-- ferry light -->
  <circle cx="380" cy="636" r="3.5" fill="#ffdcae" opacity=".9"/>
  <path d="M330 640 L420 636 L430 646 L320 650 Z" fill="#2e3a3c" opacity=".8"/>

  <rect width="1600" height="1000" fill="url(#vignette)"/>
  <rect width="1600" height="1000" filter="url(#grain)" opacity=".7"/>
</svg>
