<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Material study — charred timber and granite</title>
  <desc id="desc">Stylised architectural close-up of charred cedar battens against quarry-split granite with a thin reveal of warm interior light.</desc>
  <defs>
    <linearGradient id="timber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3d2f23"/>
      <stop offset=".5" stop-color="#2a2119"/>
      <stop offset="1" stop-color="#1b1611"/>
    </linearGradient>
    <linearGradient id="granite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8e8a82"/>
      <stop offset=".5" stop-color="#76726a"/>
      <stop offset="1" stop-color="#5a574f"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8ce93" stop-opacity=".9"/>
      <stop offset="1" stop-color="#f8ce93" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx=".5" cy=".5" r=".78">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#0c0b09" stop-opacity=".7"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".1"/></feComponentTransfer>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <rect width="1600" height="1000" fill="#211a14"/>
  <rect x="760" y="0" width="840" height="1000" fill="url(#granite)"/>
  <g fill="#615d55" opacity=".7">
    <path d="M820 80 L940 40 L1010 120 L880 170 Z"/><path d="M1100 240 L1240 190 L1330 300 L1180 350 Z"/>
    <path d="M900 500 L1020 440 L1120 540 L980 610 Z"/><path d="M1240 660 L1420 590 L1500 740 L1320 790 Z"/>
    <path d="M840 800 L980 760 L1060 880 L900 930 Z"/>
  </g>
  <g stroke="#9c978d" stroke-width="1.4" opacity=".35">
    <path d="M760 160 L1600 120"/><path d="M760 420 L1600 380"/><path d="M760 700 L1600 650"/>
  </g>

  <!-- timber battens -->
  <g>
    <rect x="0" y="0" width="760" height="1000" fill="url(#timber)"/>
    <g fill="#4a3726">
      <rect x="0" y="0" width="58" height="1000"/><rect x="80" y="0" width="58" height="1000"/>
      <rect x="160" y="0" width="58" height="1000"/><rect x="240" y="0" width="58" height="1000"/>
      <rect x="320" y="0" width="58" height="1000"/><rect x="400" y="0" width="58" height="1000"/>
      <rect x="480" y="0" width="58" height="1000"/><rect x="560" y="0" width="58" height="1000"/>
      <rect x="640" y="0" width="58" height="1000"/><rect x="720" y="0" width="40" height="1000"/>
    </g>
    <g fill="#120e0a" opacity=".85">
      <rect x="58" y="0" width="22" height="1000"/><rect x="138" y="0" width="22" height="1000"/>
      <rect x="218" y="0" width="22" height="1000"/><rect x="298" y="0" width="22" height="1000"/>
      <rect x="378" y="0" width="22" height="1000"/><rect x="458" y="0" width="22" height="1000"/>
      <rect x="538" y="0" width="22" height="1000"/><rect x="618" y="0" width="22" height="1000"/>
      <rect x="698" y="0" width="22" height="1000"/>
    </g>
  </g>

  <!-- warm reveal -->
  <rect x="728" y="0" width="18" height="1000" fill="#2a1f16"/>
  <rect x="746" y="0" width="20" height="1000" fill="#f6c98e"/>
  <rect x="766" y="0" width="16" height="1000" fill="#2a1f16"/>
  <rect x="730" y="0" width="60" height="1000" fill="url(#light)" opacity=".55" filter="url(#blur)"/>

  <!-- shadow line -->
  <rect x="0" y="740" width="1600" height="260" fill="#0b0a08" opacity=".35"/>

  <!-- planter silhouette -->
  <g fill="#1d231b">
    <ellipse cx="1340" cy="780" rx="140" ry="60"/><ellipse cx="1460" cy="720" rx="90" ry="46"/>
    <path d="M1280 900 L1320 820 L1360 900 Z"/><path d="M1400 900 L1440 800 L1480 900 Z"/>
  </g>

  <rect width="1600" height="1000" fill="url(#vignette)"/>
  <rect width="1600" height="1000" filter="url(#grain)" opacity=".9"/>
</svg>
