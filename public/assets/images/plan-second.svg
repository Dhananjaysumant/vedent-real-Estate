<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Second floor plan — Vanguard coastal villa</title>
  <desc id="desc">Illustrative second floor plan with sky lounge, study, wellness room, guest suite and sheltered terrace. Not to scale.</desc>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0 H0 V20" fill="none" stroke="#171916" stroke-opacity=".06" stroke-width=".6"/>
    </pattern>
    <pattern id="stone" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M0 14 L14 0" stroke="#171916" stroke-opacity=".18" stroke-width=".7"/>
    </pattern>
    <style>
      .wall { fill: #171916; }
      .room { fill: none; stroke: #171916; stroke-width: 1.2; stroke-opacity: .55; }
      .label { font-family: Inter, Arial, sans-serif; font-size: 13px; letter-spacing: 2px; fill: #171916; }
      .sub { font-family: Inter, Arial, sans-serif; font-size: 10px; letter-spacing: 1.6px; fill: #6e6a62; }
      .meta { font-family: Inter, Arial, sans-serif; font-size: 10px; letter-spacing: 2.4px; fill: #6e6a62; }
      .furn { fill: none; stroke: #171916; stroke-width: 1; stroke-opacity: .45; }
      .dim { stroke: #b79a6a; stroke-width: 1; fill: none; }
    </style>
  </defs>

  <rect width="1200" height="900" fill="#f3f0e9"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <text x="80" y="70" class="label">VANGUARD ESTATES</text>
  <text x="80" y="90" class="sub">ARCHITECTURAL STUDY — COASTAL COLLECTION</text>
  <text x="1120" y="70" text-anchor="end" class="meta">LEVEL 02 / SECOND FLOOR</text>
  <text x="1120" y="88" text-anchor="end" class="meta">NOT TO SCALE</text>

  <!-- lower roof / setback outline -->
  <rect x="300" y="230" width="640" height="420" fill="none" stroke="#171916" stroke-opacity=".18" stroke-dasharray="5 7"/>
  <rect x="410" y="270" width="440" height="320" fill="#fbf9f4"/>
  <g class="wall">
    <rect x="410" y="270" width="12" height="320"/>
    <rect x="410" y="270" width="440" height="12"/>
    <rect x="410" y="578" width="440" height="12"/>
    <rect x="838" y="270" width="12" height="320"/>
    <rect x="620" y="282" width="9" height="120"/>
    <rect x="620" y="460" width="9" height="118"/>
    <rect x="500" y="430" width="120" height="8"/>
    <rect x="620" y="430" width="218" height="8"/>
  </g>

  <!-- sky lounge -->
  <rect x="422" y="282" width="198" height="270" class="room"/>
  <text x="442" y="326" class="label">SKY LOUNGE</text>
  <text x="442" y="344" class="sub">WEST LIGHT / 44 M²</text>
  <rect x="456" y="380" width="110" height="28" class="furn"/>
  <rect x="492" y="426" width="46" height="22" class="furn"/>
  <rect x="442" y="470" width="34" height="54" class="furn"/>
  <!-- study -->
  <rect x="422" y="560" width="0" height="0"/>
  <rect x="500" y="438" width="120" height="140" class="room"/>
  <text x="514" y="480" class="sub">STUDY</text>
  <rect x="520" y="500" width="76" height="34" class="furn"/>
  <!-- wellness -->
  <rect x="630" y="282" width="88" height="150" class="room"/>
  <text x="644" y="326" class="sub" transform="rotate(90 644 326)">WELLNESS</text>
  <rect x="648" y="300" width="52" height="20" class="furn"/>
  <!-- bath -->
  <rect x="630" y="438" width="88" height="140" class="room"/>
  <text x="652" y="498" class="sub" transform="rotate(90 652 498)">BATH</text>
  <!-- guest suite -->
  <rect x="728" y="282" width="110" height="296" class="room"/>
  <text x="742" y="322" class="label">GUEST</text>
  <text x="742" y="340" class="label">SUITE</text>
  <rect x="746" y="370" width="70" height="76" class="furn"/>
  <rect x="752" y="474" width="58" height="42" class="furn"/>
  <!-- terrace -->
  <rect x="300" y="600" width="200" height="90" fill="url(#stone)" stroke="#171916" stroke-opacity=".35"/>
  <text x="400" y="650" text-anchor="middle" class="sub">SHELTERED TERRACE</text>
  <!-- void / lightwell -->
  <rect x="500" y="300" width="100" height="110" fill="#e9e7df" class="room"/>
  <g stroke="#171916" stroke-opacity=".25"><path d="M520 300 L580 410"/><path d="M580 300 L520 410"/></g>
  <text x="550" y="358" text-anchor="middle" class="sub">VOID</text>

  <!-- glazing -->
  <g stroke="#8b9e9a" stroke-width="4">
    <path d="M430 270 H520"/><path d="M430 578 H500"/><path d="M540 578 H610"/>
    <path d="M838 330 V400"/><path d="M838 420 V500"/>
  </g>
  <g fill="none" stroke="#171916" stroke-opacity=".5" stroke-width="1">
    <path d="M620 360 A24 24 0 0 0 596 384"/>
    <path d="M500 410 A22 22 0 0 0 522 432"/>
  </g>

  <g transform="translate(1070 250)">
    <path d="M0 24 L10 0 L20 24 L10 18 Z" fill="#171916"/>
    <text x="10" y="44" text-anchor="middle" class="meta">N</text>
  </g>
  <g transform="translate(80 800)">
    <path d="M0 0 H120" class="dim"/>
    <path d="M0 -5 V5 M60 -5 V5 M120 -5 V5" class="dim"/>
    <text x="60" y="20" text-anchor="middle" class="meta">10 M (APPROX.)</text>
  </g>
  <text x="1120" y="840" text-anchor="end" class="meta">ILLUSTRATIVE DEMONSTRATION DRAWING — NOT A SURVEY</text>
</svg>
