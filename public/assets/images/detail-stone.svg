<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Material study — limestone, oak and bronze</title>
  <desc id="desc">Stylised close-up architectural study of honed limestone, warm oak slats, bronze mullions and raking afternoon light.</desc>
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3d8c6"/>
      <stop offset=".45" stop-color="#cdc0a9"/>
      <stop offset="1" stop-color="#a99a82"/>
    </linearGradient>
    <linearGradient id="oak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b28354"/>
      <stop offset=".5" stop-color="#96693d"/>
      <stop offset="1" stop-color="#6f4a29"/>
    </linearGradient>
    <linearGradient id="shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2823" stop-opacity=".75"/>
      <stop offset="1" stop-color="#2b2823" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9cfbc"/>
      <stop offset="1" stop-color="#f0e4cf"/>
    </linearGradient>
    <radialGradient id="vignette" cx=".5" cy=".5" r=".75">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#171310" stop-opacity=".6"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".09"/></feComponentTransfer>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1600" height="1000" fill="#c9bba5"/>
  <!-- stone wall right -->
  <rect x="640" y="0" width="960" height="1000" fill="url(#stone)"/>
  <g stroke="#b0a086" stroke-width="1.6" opacity=".65">
    <path d="M640 120 H1600"/><path d="M640 260 H1600"/><path d="M640 400 H1600"/><path d="M640 540 H1600"/><path d="M640 680 H1600"/><path d="M640 820 H1600"/>
    <path d="M800 0 V1000"/><path d="M980 0 V1000"/><path d="M1160 0 V1000"/><path d="M1340 0 V1000"/><path d="M1520 0 V1000"/>
  </g>
  <g fill="#b7a78d" opacity=".5">
    <ellipse cx="880" cy="180" rx="30" ry="10"/><ellipse cx="1120" cy="330" rx="44" ry="14"/><ellipse cx="760" cy="620" rx="26" ry="9"/>
    <ellipse cx="1420" cy="760" rx="38" ry="12"/><ellipse cx="1260" cy="480" rx="22" ry="8"/>
  </g>

  <!-- light shaft -->
  <path d="M0 0 L620 0 L980 1000 L300 1000 Z" fill="url(#sky)" opacity=".22"/>
  <path d="M0 0 L220 0 L620 1000 L300 1000 Z" fill="#fff6e4" opacity=".18"/>

  <!-- oak slat wall -->
  <g>
    <rect x="0" y="0" width="620" height="1000" fill="url(#oak)"/>
    <g stroke="#5f3f22" stroke-width="3" opacity=".5">
      <path d="M40 0 V1000"/><path d="M100 0 V1000"/><path d="M160 0 V1000"/><path d="M220 0 V1000"/><path d="M280 0 V1000"/><path d="M340 0 V1000"/><path d="M400 0 V1000"/><path d="M460 0 V1000"/><path d="M520 0 V1000"/><path d="M580 0 V1000"/>
    </g>
    <g stroke="#c08f5c" stroke-width="1.2" opacity=".35">
      <path d="M10 0 V1000"/><path d="M70 0 V1000"/><path d="M130 0 V1000"/><path d="M190 0 V1000"/><path d="M250 0 V1000"/><path d="M310 0 V1000"/><path d="M370 0 V1000"/><path d="M430 0 V1000"/><path d="M490 0 V1000"/><path d="M550 0 V1000"/>
    </g>
  </g>

  <!-- bronze mullion -->
  <rect x="596" y="0" width="44" height="1000" fill="#3d3428"/>
  <rect x="596" y="0" width="8" height="1000" fill="#6e5c44"/>
  <rect x="632" y="0" width="10" height="1000" fill="#241f19"/>

  <!-- glass panel with reflection -->
  <rect x="1040" y="150" width="460" height="700" fill="#8b9a95" opacity=".22"/>
  <path d="M1040 150 L1320 150 L1120 850 L1040 850 Z" fill="#f4ead8" opacity=".16"/>
  <rect x="1040" y="150" width="460" height="700" fill="none" stroke="#3d3428" stroke-width="14"/>

  <!-- shadow gradient -->
  <rect x="0" y="640" width="1600" height="360" fill="url(#shadow)" opacity=".45"/>

  <!-- raking light edge -->
  <path d="M620 0 L660 0 L1050 1000 L1010 1000 Z" fill="#ffe9c8" opacity=".28" filter="url(#blur)"/>

  <!-- floating stone bench -->
  <rect x="760" y="720" width="660" height="90" fill="#c4b49b"/>
  <rect x="760" y="720" width="660" height="12" fill="#e5d8c2"/>
  <rect x="760" y="810" width="660" height="22" fill="#8f8170"/>

  <!-- planting shadow -->
  <g stroke="#5b5846" stroke-width="2" fill="none" opacity=".45">
    <path d="M1200 1000 q-40 -140 -120 -180"/><path d="M1240 1000 q0 -160 -60 -220"/><path d="M1290 1000 q40 -150 120 -200"/>
  </g>
  <g fill="#4a5443" opacity=".4">
    <ellipse cx="1080" cy="820" rx="70" ry="22"/><ellipse cx="1180" cy="780" rx="50" ry="16"/>
  </g>

  <rect width="1600" height="1000" fill="url(#vignette)"/>
  <rect width="1600" height="1000" filter="url(#grain)" opacity=".8"/>
</svg>
