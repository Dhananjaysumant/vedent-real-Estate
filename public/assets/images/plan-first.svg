<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">First floor plan — Vanguard coastal villa</title>
  <desc id="desc">Illustrative first floor plan with primary suite, private terrace, dressing room, two bedrooms and family room. Not to scale.</desc>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0 H0 V20" fill="none" stroke="#171916" stroke-opacity=".06" stroke-width=".6"/>
    </pattern>
    <pattern id="stone" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M0 14 L14 0" stroke="#171916" stroke-opacity=".18" stroke-width=".7"/>
    </pattern>
    <style>
      .wall { fill: #171916; }
      .room { fill: none; stroke: #171916; stroke-width: 1.2; stroke-opacity: .55; }
      .label { font-family: Inter, Arial, sans-serif; font-size: 13px; letter-spacing: 2px; fill: #171916; }
      .sub { font-family: Inter, Arial, sans-serif; font-size: 10px; letter-spacing: 1.6px; fill: #6e6a62; }
      .meta { font-family: Inter, Arial, sans-serif; font-size: 10px; letter-spacing: 2.4px; fill: #6e6a62; }
      .furn { fill: none; stroke: #171916; stroke-width: 1; stroke-opacity: .45; }
      .dim { stroke: #b79a6a; stroke-width: 1; fill: none; }
    </style>
  </defs>

  <rect width="1200" height="900" fill="#f3f0e9"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <text x="80" y="70" class="label">VANGUARD ESTATES</text>
  <text x="80" y="90" class="sub">ARCHITECTURAL STUDY — COASTAL COLLECTION</text>
  <text x="1120" y="70" text-anchor="end" class="meta">LEVEL 01 / FIRST FLOOR</text>
  <text x="1120" y="88" text-anchor="end" class="meta">NOT TO SCALE</text>

  <!-- footprint (upper volume cantilever) -->
  <rect x="300" y="250" width="620" height="360" fill="#fbf9f4"/>
  <!-- shadow of level below -->
  <rect x="300" y="610" width="500" height="54" fill="url(#stone)" fill-opacity=".55" stroke="#171916" stroke-opacity=".25"/>

  <g class="wall">
    <rect x="300" y="250" width="12" height="360"/>
    <rect x="300" y="250" width="620" height="12"/>
    <rect x="300" y="598" width="620" height="12"/>
    <rect x="908" y="250" width="12" height="360"/>
    <rect x="560" y="262" width="10" height="130"/>
    <rect x="560" y="450" width="10" height="148"/>
    <rect x="560" y="442" width="150" height="8"/>
    <rect x="700" y="262" width="9" height="120"/>
    <rect x="790" y="380" width="118" height="8"/>
  </g>

  <!-- primary suite -->
  <rect x="312" y="262" width="238" height="336" class="room"/>
  <text x="332" y="310" class="label">PRIMARY SUITE</text>
  <text x="332" y="328" class="sub">52 M²</text>
  <rect x="352" y="360" width="120" height="86" class="furn"/>
  <rect x="372" y="374" width="80" height="54" class="furn"/>
  <text x="332" y="490" class="sub">BED / SITTING</text>
  <!-- dressing -->
  <rect x="312" y="500" width="110" height="98" class="room"/>
  <text x="322" y="552" class="sub">DRESSING</text>
  <text x="322" y="568" class="sub">BATH</text>
  <rect x="432" y="500" width="118" height="98" class="room"/>
  <text x="442" y="542" class="sub">PRIMARY</text>
  <text x="442" y="558" class="sub">BATH</text>
  <ellipse cx="504" cy="566" rx="28" ry="16" class="furn"/>
  <!-- terrace -->
  <rect x="312" y="612" width="238" height="0" fill="none"/>
  <rect x="300" y="612" width="240" height="76" fill="url(#stone)" stroke="#171916" stroke-opacity=".35"/>
  <text x="420" y="654" text-anchor="middle" class="sub">PRIVATE TERRACE</text>

  <!-- family room -->
  <rect x="570" y="262" width="338" height="178" class="room"/>
  <text x="590" y="308" class="label">FAMILY ROOM</text>
  <text x="590" y="326" class="sub">32 M² / NORTH LIGHT</text>
  <rect x="620" y="356" width="130" height="30" class="furn"/>
  <rect x="660" y="398" width="52" height="24" class="furn"/>
  <!-- bedroom 2 -->
  <rect x="570" y="450" width="160" height="148" class="room"/>
  <text x="584" y="490" class="sub">BEDROOM 02</text>
  <rect x="596" y="510" width="80" height="54" class="furn"/>
  <!-- bedroom 3 -->
  <rect x="740" y="450" width="168" height="148" class="room"/>
  <text x="754" y="490" class="sub">BEDROOM 03</text>
  <rect x="770" y="510" width="76" height="52" class="furn"/>
  <!-- bath / stair -->
  <rect x="708" y="262" width="200" height="120" class="room"/>
  <text x="720" y="300" class="sub">BATH / LAUNDRY</text>
  <rect x="730" y="330" width="60" height="34" class="furn"/>
  <rect x="810" y="330" width="70" height="34" class="furn"/>
  <!-- stair -->
  <rect x="790" y="392" width="118" height="50" class="room"/>
  <g stroke="#171916" stroke-opacity=".4"><path d="M806 392 V442"/><path d="M822 392 V442"/><path d="M838 392 V442"/><path d="M854 392 V442"/><path d="M870 392 V442"/><path d="M886 392 V442"/></g>

  <!-- glazing -->
  <g stroke="#8b9e9a" stroke-width="4">
    <path d="M340 250 H440"/><path d="M460 250 H540"/><path d="M620 598 H700"/><path d="M720 598 H800"/>
    <path d="M908 300 V380"/><path d="M908 400 V480"/>
  </g>
  <g fill="none" stroke="#171916" stroke-opacity=".5" stroke-width="1">
    <path d="M560 402 A26 26 0 0 1 586 428"/>
    <path d="M700 400 A24 24 0 0 0 676 424"/>
  </g>

  <g transform="translate(1070 250)">
    <path d="M0 24 L10 0 L20 24 L10 18 Z" fill="#171916"/>
    <text x="10" y="44" text-anchor="middle" class="meta">N</text>
  </g>
  <g transform="translate(80 800)">
    <path d="M0 0 H120" class="dim"/>
    <path d="M0 -5 V5 M60 -5 V5 M120 -5 V5" class="dim"/>
    <text x="60" y="20" text-anchor="middle" class="meta">10 M (APPROX.)</text>
  </g>
  <text x="1120" y="840" text-anchor="end" class="meta">ILLUSTRATIVE DEMONSTRATION DRAWING — NOT A SURVEY</text>
</svg>
