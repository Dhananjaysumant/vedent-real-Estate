<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Residence 07, Aurelia Residences</title>
  <desc id="desc">Stylised apartment interior with sandstone tones, a stone kitchen island and deep glass doors opening to a planted harbour loggia.</desc>
  <defs>
    <linearGradient id="view" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8b3b4"/>
      <stop offset=".55" stop-color="#d6c7b1"/>
      <stop offset=".62" stop-color="#6f8688"/>
      <stop offset="1" stop-color="#8fa1a0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b3a28b"/>
      <stop offset="1" stop-color="#8a7b66"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0d5c2"/>
      <stop offset="1" stop-color="#cbbda7"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d5c7b1"/>
      <stop offset=".6" stop-color="#bdae96"/>
      <stop offset="1" stop-color="#a2927b"/>
    </linearGradient>
    <radialGradient id="light" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe3b8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffe3b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".45" r=".8">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#211a12" stop-opacity=".5"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".05"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#d8cbb6"/>
  <path d="M0 0 H1600 V236 L0 214 Z" fill="#e7dcc9"/>
  <path d="M0 214 L1600 236 V260 L0 238 Z" fill="#c3b49d"/>
  <path d="M0 742 L1600 762 V1000 H0 Z" fill="url(#floor)"/>
  <g stroke="#8c7c65" stroke-width="2" opacity=".35">
    <path d="M0 800 L1600 818"/><path d="M0 870 L1600 888"/><path d="M0 944 L1600 960"/>
  </g>
  <path d="M0 0 V1000 H110 L134 238 V0 Z" fill="url(#wall)"/>
  <path d="M1600 0 V1000 H1490 L1470 240 V0 Z" fill="#cdbfa9"/>

  <!-- loggia view -->
  <rect x="170" y="236" width="1280" height="530" fill="url(#view)"/>
  <g stroke="#e2d4bd" stroke-width="1.5" opacity=".4">
    <path d="M170 520 H1450"/><path d="M170 570 H1450"/><path d="M170 630 H1450"/><path d="M170 700 H1450"/>
  </g>
  <!-- harbour + far shore -->
  <path d="M170 520 C300 492 420 500 520 520 L530 766 L170 766 Z" fill="#77867d" opacity=".5"/>
  <path d="M1120 520 C1240 494 1350 500 1450 522 L1450 766 L1120 766 Z" fill="#6f7f78" opacity=".5"/>
  <g fill="#8b9691" opacity=".6">
    <rect x="620" y="470" width="10" height="42"/><rect x="640" y="458" width="18" height="54"/><rect x="668" y="476" width="8" height="36"/>
    <rect x="860" y="462" width="14" height="50"/><rect x="884" y="450" width="22" height="62"/>
  </g>
  <path d="M600 600 L700 596 L710 610 L590 616 Z" fill="#f0dfc5" opacity=".5"/>

  <!-- deep loggia / planting -->
  <g fill="#4d5c4a">
    <ellipse cx="250" cy="650" rx="80" ry="46"/><ellipse cx="360" cy="700" rx="60" ry="32"/>
    <ellipse cx="1350" cy="660" rx="80" ry="42"/><ellipse cx="1250" cy="710" rx="56" ry="30"/>
  </g>
  <g stroke="#3a4736" stroke-width="4" fill="none" opacity=".8">
    <path d="M250 760 V620"/><path d="M360 760 V670"/><path d="M1350 760 V620"/><path d="M1250 760 V680"/>
  </g>

  <!-- window frames -->
  <g fill="#3c3b35">
    <rect x="170" y="236" width="12" height="530"/><rect x="605" y="236" width="10" height="530"/><rect x="1015" y="236" width="10" height="530"/><rect x="1438" y="236" width="12" height="530"/>
    <rect x="170" y="236" width="1280" height="14"/><rect x="170" y="752" width="1280" height="14"/>
  </g>
  <ellipse cx="600" cy="520" rx="360" ry="150" fill="url(#light)" opacity=".5"/>

  <!-- upper cabinets -->
  <rect x="1120" y="352" width="320" height="100" fill="#8d7c65"/>
  <g stroke="#6f5f4a" stroke-width="2"><path d="M1200 352 V452"/><path d="M1280 352 V452"/><path d="M1360 352 V452"/></g>

  <!-- kitchen island -->
  <rect x="820" y="660" width="500" height="160" fill="url(#stone)"/>
  <rect x="820" y="660" width="500" height="18" fill="#e4d7c2"/>
  <g stroke="#a5957f" stroke-width="1.5" opacity=".7"><path d="M960 678 V820"/><path d="M1120 678 V820"/><path d="M1270 678 V820"/></g>
  <rect x="870" y="630" width="60" height="30" fill="#3b3a34"/>
  <rect x="1180" y="638" width="80" height="22" fill="#d6c7ae"/>
  <rect x="860" y="644" width="30" height="16" fill="#b29d7f"/>
  <rect x="1000" y="700" width="120" height="80" fill="#3d3c36"/>
  <rect x="1010" y="710" width="100" height="60" fill="#5a5449"/>

  <!-- stools -->
  <g fill="#6f5a43">
    <rect x="900" y="828" width="54" height="14" rx="6"/><rect x="918" y="842" width="8" height="52"/>
    <rect x="1000" y="832" width="54" height="14" rx="6"/><rect x="1018" y="846" width="8" height="52"/>
    <rect x="1100" y="836" width="54" height="14" rx="6"/><rect x="1118" y="850" width="8" height="52"/>
  </g>

  <!-- dining table foreground -->
  <rect x="340" y="742" width="330" height="18" fill="#8a6f4f"/>
  <rect x="360" y="760" width="10" height="120" fill="#3f3021"/><rect x="640" y="760" width="10" height="120" fill="#3f3021"/>
  <g fill="#cdbfa9">
    <rect x="380" y="712" width="70" height="30" rx="10"/><rect x="470" y="706" width="70" height="36" rx="12"/><rect x="570" y="714" width="60" height="28" rx="10"/>
  </g>
  <g fill="#40382c">
    <rect x="372" y="860" width="60" height="10"/><rect x="470" y="856" width="60" height="10"/><rect x="566" y="862" width="60" height="10"/>
  </g>

  <!-- pendant lights -->
  <g>
    <path d="M330 0 V430" stroke="#7c7466" stroke-width="2"/><path d="M330 430 V470" stroke="#7c7466" stroke-width="2"/>
    <circle cx="330" cy="486" r="26" fill="#f4dfb8"/><circle cx="330" cy="486" r="10" fill="#fff0cf"/>
    <path d="M1250 0 V360" stroke="#7c7466" stroke-width="2"/>
    <circle cx="1250" cy="376" r="22" fill="#f4dfb8"/><circle cx="1250" cy="376" r="8" fill="#fff0cf"/>
  </g>

  <!-- artwork -->
  <rect x="1160" y="300" width="200" height="250" fill="#e2d6c2"/>
  <rect x="1176" y="316" width="168" height="218" fill="#c3b49c"/>
  <path d="M1176 480 C1220 430 1280 450 1344 400 L1344 534 L1176 534 Z" fill="#8b968b" opacity=".65"/>

  <!-- bench / shoe cabinet -->
  <rect x="180" y="620" width="180" height="16" fill="#8b7050"/>
  <rect x="190" y="636" width="10" height="126" fill="#4a3927"/><rect x="340" y="636" width="10" height="126" fill="#4a3927"/>

  <rect width="1600" height="1000" fill="url(#vignette)"/>
  <rect width="1600" height="1000" filter="url(#grain)" opacity=".65"/>
</svg>
