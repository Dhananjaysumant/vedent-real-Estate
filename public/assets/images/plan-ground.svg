<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Ground floor plan — Vanguard coastal villa</title>
  <desc id="desc">Illustrative architectural plan showing the living pavilion, kitchen, dining room, study, guest suite, gallery, arrival court, terrace and pool. Not to scale.</desc>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0 H0 V20" fill="none" stroke="#171916" stroke-opacity=".06" stroke-width=".6"/>
    </pattern>
    <pattern id="stone" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M0 14 L14 0" stroke="#171916" stroke-opacity=".18" stroke-width=".7"/>
    </pattern>
    <pattern id="water" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 5 H10" stroke="#4f6f6c" stroke-opacity=".45" stroke-width=".8"/>
    </pattern>
    <style>
      .wall { fill: #171916; }
      .room { fill: none; stroke: #171916; stroke-width: 1.2; stroke-opacity: .55; }
      .label { font-family: Inter, Arial, sans-serif; font-size: 13px; letter-spacing: 2px; fill: #171916; }
      .sub { font-family: Inter, Arial, sans-serif; font-size: 10px; letter-spacing: 1.6px; fill: #6e6a62; }
      .meta { font-family: Inter, Arial, sans-serif; font-size: 10px; letter-spacing: 2.4px; fill: #6e6a62; }
      .furn { fill: none; stroke: #171916; stroke-width: 1; stroke-opacity: .45; }
      .dim { stroke: #b79a6a; stroke-width: 1; fill: none; }
    </style>
  </defs>

  <rect width="1200" height="900" fill="#f3f0e9"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <text x="80" y="70" class="label">VANGUARD ESTATES</text>
  <text x="80" y="90" class="sub">ARCHITECTURAL STUDY — COASTAL COLLECTION</text>
  <text x="1120" y="70" text-anchor="end" class="meta">LEVEL 00 / GROUND FLOOR</text>
  <text x="1120" y="88" text-anchor="end" class="meta">NOT TO SCALE</text>

  <!-- site lines -->
  <rect x="120" y="200" width="960" height="580" fill="none" stroke="#171916" stroke-opacity=".2" stroke-width="1" stroke-dasharray="6 8"/>

  <!-- arrival court -->
  <rect x="140" y="220" width="240" height="120" fill="url(#stone)" fill-opacity=".5" stroke="#171916" stroke-opacity=".35"/>
  <rect x="160" y="240" width="70" height="40" fill="none" stroke="#171916" stroke-opacity=".35"/>
  <text x="260" y="290" class="sub">ARRIVAL</text>
  <text x="260" y="306" class="sub">COURT</text>

  <!-- water court -->
  <rect x="760" y="220" width="280" height="80" fill="url(#water)" stroke="#171916" stroke-opacity=".35"/>
  <text x="900" y="266" text-anchor="middle" class="sub">REFLECTING COURT</text>

  <!-- main walls -->
  <rect x="390" y="240" width="350" height="380" fill="#fb f9 f4"/>
  <rect x="390" y="240" width="350" height="380" fill="#fbf9f4"/>
  <rect x="390" y="240" width="350" height="380" fill="none" class="wall" stroke="none"/>
  <!-- outer wall strokes -->
  <g class="wall">
    <rect x="390" y="240" width="12" height="380"/>
    <rect x="390" y="240" width="350" height="12"/>
    <rect x="390" y="608" width="350" height="12"/>
    <rect x="728" y="240" width="12" height="380"/>
    <!-- internal walls -->
    <rect x="560" y="252" width="10" height="120"/>
    <rect x="560" y="440" width="10" height="168"/>
    <rect x="398" y="430" width="150" height="8"/>
    <rect x="650" y="370" width="90" height="8"/>
    <rect x="650" y="500" width="90" height="8"/>
    <rect x="648" y="500" width="10" height="108"/>
  </g>

  <!-- gallery -->
  <rect x="402" y="252" width="158" height="178" class="room"/>
  <rect x="410" y="420" width="158" height="8" fill="#171916" opacity=".6"/>
  <text x="420" y="300" class="label">GALLERY</text>
  <text x="420" y="318" class="sub">ARRIVAL / ART</text>
  <!-- living pavilion -->
  <rect x="402" y="438" width="340" height="162" class="room"/>
  <text x="430" y="484" class="label">LIVING PAVILION</text>
  <text x="430" y="502" class="sub">68 M²</text>
  <rect x="440" y="524" width="120" height="34" rx="3" class="furn"/>
  <rect x="482" y="562" width="54" height="20" class="furn"/>
  <rect x="600" y="514" width="18" height="80" class="furn"/>
  <!-- dining -->
  <rect x="570" y="252" width="170" height="178" class="room"/>
  <text x="584" y="300" class="label">DINING</text>
  <rect x="606" y="322" width="92" height="34" class="furn"/>
  <g class="furn"><rect x="612" y="362" width="12" height="10"/><rect x="640" y="362" width="12" height="10"/><rect x="668" y="362" width="12" height="10"/></g>
  <g class="furn"><rect x="612" y="306" width="12" height="10"/><rect x="640" y="306" width="12" height="10"/><rect x="668" y="306" width="12" height="10"/></g>
  <!-- kitchen -->
  <rect x="660" y="252" width="60" height="118" class="room"/>
  <text x="668" y="286" class="sub" transform="rotate(90 668 286)">KITCHEN</text>
  <rect x="668" y="262" width="10" height="100" class="furn"/>
  <rect x="700" y="262" width="10" height="100" class="furn"/>
  <!-- pantry -->
  <rect x="660" y="378" width="68" height="84" class="room"/>
  <text x="694" y="426" text-anchor="middle" class="sub">PANTRY</text>
  <!-- study -->
  <rect x="660" y="508" width="58" height="100" class="room"/>
  <text x="689" y="562" text-anchor="middle" class="sub" transform="rotate(90 689 562)">STUDY</text>
  <!-- terrace -->
  <rect x="390" y="620" width="350" height="70" fill="url(#stone)" fill-opacity=".7" stroke="#171916" stroke-opacity=".35"/>
  <text x="565" y="662" text-anchor="middle" class="sub">COVERED TERRACE</text>
  <!-- pool -->
  <rect x="430" y="700" width="330" height="62" fill="url(#water)" stroke="#171916" stroke-opacity=".4"/>
  <text x="595" y="736" text-anchor="middle" class="sub">INFINITY POOL — 18 M</text>

  <!-- guest wing -->
  <rect x="770" y="340" width="200" height="240" fill="#fbf9f4"/>
  <g class="wall">
    <rect x="762" y="340" width="12" height="240"/>
    <rect x="762" y="340" width="208" height="12"/>
    <rect x="762" y="568" width="208" height="12"/>
    <rect x="958" y="340" width="12" height="240"/>
    <rect x="860" y="352" width="8" height="100"/>
  </g>
  <text x="782" y="384" class="label">GUEST SUITE</text>
  <text x="782" y="402" class="sub">BEDROOM / BATH</text>
  <rect x="782" y="420" width="62" height="80" class="furn"/>
  <rect x="872" y="360" width="76" height="88" class="furn"/>
  <text x="876" y="470" class="sub">BATH</text>
  <!-- garden -->
  <rect x="770" y="590" width="300" height="190" fill="#e9e7df" stroke="#171916" stroke-opacity=".2"/>
  <text x="920" y="660" text-anchor="middle" class="sub">PLANTED GARDEN</text>
  <g fill="none" stroke="#171916" stroke-opacity=".25">
    <circle cx="850" cy="700" r="22"/><circle cx="900" cy="720" r="16"/><circle cx="980" cy="690" r="26"/><circle cx="1030" cy="730" r="18"/>
    <circle cx="820" cy="742" r="14"/>
  </g>

  <!-- windows -->
  <g stroke="#8b9e9a" stroke-width="4">
    <path d="M470 240 H550"/><path d="M580 240 H650"/><path d="M470 608 H540"/><path d="M560 608 H650"/>
    <path d="M400 300 V360"/><path d="M400 380 V420"/>
    <path d="M962 380 V430"/><path d="M962 450 V540"/>
  </g>
  <!-- door swings -->
  <g fill="none" stroke="#171916" stroke-opacity=".5" stroke-width="1">
    <path d="M560 372 A28 28 0 0 1 588 400" transform="translate(0 0)"/>
    <path d="M660 462 A24 24 0 0 1 684 486"/>
    <path d="M770 380 A26 26 0 0 0 744 406"/>
    <path d="M390 470 A24 24 0 0 0 414 494"/>
  </g>

  <!-- north / scale -->
  <g transform="translate(1070 220)">
    <path d="M0 24 L10 0 L20 24 L10 18 Z" fill="#171916"/>
    <text x="10" y="44" text-anchor="middle" class="meta">N</text>
  </g>
  <g transform="translate(80 800)">
    <path d="M0 0 H120" class="dim"/>
    <path d="M0 -5 V5 M60 -5 V5 M120 -5 V5" class="dim"/>
    <text x="60" y="20" text-anchor="middle" class="meta">10 M (APPROX.)</text>
  </g>
  <text x="1120" y="840" text-anchor="end" class="meta">ILLUSTRATIVE DEMONSTRATION DRAWING — NOT A SURVEY</text>
</svg>
