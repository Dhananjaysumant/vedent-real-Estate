<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">The great room, The Highlands Estate</title>
  <desc id="desc">Stylised alpine interior with a stone hearth, dark oak floors, leather armchairs and a wide view of snow-covered mountains.</desc>
  <defs>
    <linearGradient id="view" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b97a2"/>
      <stop offset=".45" stop-color="#c3c4c0"/>
      <stop offset=".62" stop-color="#d7d3c8"/>
      <stop offset="1" stop-color="#9aa09a"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5e4632"/>
      <stop offset="1" stop-color="#33251a"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e6458"/>
      <stop offset=".5" stop-color="#8f8375"/>
      <stop offset="1" stop-color="#75695c"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a9186"/>
      <stop offset=".5" stop-color="#7e756a"/>
      <stop offset="1" stop-color="#615a51"/>
    </linearGradient>
    <radialGradient id="fire" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd39a" stop-opacity=".95"/>
      <stop offset=".4" stop-color="#e8a35c" stop-opacity=".5"/>
      <stop offset="1" stop-color="#e8a35c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".45" r=".8">
      <stop offset=".45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#0f0d0b" stop-opacity=".65"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".06"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#3b332b"/>
  <!-- ceiling with timber beams -->
  <path d="M0 0 H1600 V250 L0 230 Z" fill="#33291f"/>
  <g fill="#4b3a29">
    <path d="M0 60 H1600 V82 H0 Z"/><path d="M0 140 H1600 V160 H0 Z"/>
    <path d="M240 0 L300 0 L322 240 L262 240 Z"/><path d="M620 0 L680 0 L688 240 L628 240 Z"/>
    <path d="M1020 0 L1080 0 L1076 240 L1016 240 Z"/><path d="M1400 0 L1460 0 L1448 240 L1388 240 Z"/>
  </g>

  <!-- floor -->
  <path d="M0 730 L1600 750 V1000 H0 Z" fill="url(#floor)"/>
  <g stroke="#7a5a3b" stroke-width="2" opacity=".35">
    <path d="M0 790 L1600 810"/><path d="M0 856 L1600 876"/><path d="M0 928 L1600 944"/><path d="M0 990 L1600 1000"/>
  </g>

  <!-- side walls -->
  <path d="M0 0 V1000 H150 L170 240 V0 Z" fill="url(#wall)"/>
  <path d="M1600 0 V1000 H1420 L1400 256 V0 Z" fill="#5e5549"/>

  <!-- window view -->
  <rect x="180" y="236" width="1240" height="500" fill="url(#view)"/>
  <path d="M180 570 L420 360 L580 480 L760 300 L980 520 L1140 380 L1420 560 L1420 736 L180 736 Z" fill="#7b858c" opacity=".85"/>
  <path d="M180 620 L340 500 L520 600 L720 470 L900 620 L1080 520 L1280 640 L1420 570 L1420 736 L180 736 Z" fill="#55605f"/>
  <g fill="#e5e2da" opacity=".9">
    <path d="M760 300 L800 358 L776 346 L758 372 L736 344 L714 356 Z"/>
    <path d="M1140 380 L1178 438 L1154 426 L1136 452 L1114 422 L1094 434 Z"/>
    <path d="M420 360 L456 412 L434 400 L418 424 L398 398 L380 408 Z"/>
  </g>
  <rect x="180" y="236" width="1240" height="500" fill="none" stroke="#201c17" stroke-width="18"/>
  <g stroke="#241f19" stroke-width="12">
    <path d="M590 236 V736"/><path d="M1000 236 V736"/>
  </g>
  <g stroke="#2b251e" stroke-width="4" opacity=".7">
    <path d="M590 236 V736"/><path d="M1000 236 V736"/>
  </g>

  <!-- stone hearth wall -->
  <rect x="120" y="300" width="300" height="440" fill="url(#stone)"/>
  <g stroke="#6f675c" stroke-width="1.5" opacity=".7">
    <path d="M120 360 H420"/><path d="M120 420 H420"/><path d="M120 480 H420"/><path d="M120 540 H420"/><path d="M120 600 H420"/><path d="M120 660 H420"/>
    <path d="M210 300 V740"/><path d="M300 300 V740"/><path d="M380 300 V740"/>
  </g>
  <rect x="188" y="556" width="164" height="128" fill="#211c17"/>
  <rect x="202" y="570" width="136" height="100" fill="#3a2a1c"/>
  <ellipse cx="270" cy="644" rx="110" ry="80" fill="url(#fire)"/>
  <g stroke="#e9d6b7" stroke-width="2" opacity=".55">
    <path d="M240 680 q10 -40 26 -54"/><path d="M280 682 q4 -46 20 -62"/><path d="M310 680 q-6 -30 8 -46"/>
  </g>

  <!-- rug -->
  <path d="M430 800 L1310 820 L1380 970 L370 950 Z" fill="#7d6b56" opacity=".85"/>
  <path d="M470 816 L1280 834 L1336 954 L414 936 Z" fill="none" stroke="#9b876d" stroke-width="4"/>

  <!-- armchairs -->
  <g>
    <rect x="520" y="740" width="210" height="130" rx="14" fill="#5b4431"/>
    <rect x="520" y="710" width="210" height="50" rx="12" fill="#6a5039"/>
    <rect x="520" y="868" width="18" height="44" fill="#2b2118"/><rect x="712" y="868" width="18" height="44" fill="#2b2118"/>
    <rect x="556" y="746" width="76" height="64" rx="8" fill="#6f5540"/>
    <rect x="650" y="746" width="64" height="64" rx="8" fill="#664c37"/>
  </g>
  <g>
    <rect x="1000" y="744" width="210" height="130" rx="14" fill="#57422f"/>
    <rect x="1000" y="714" width="210" height="50" rx="12" fill="#66503a"/>
    <rect x="1000" y="872" width="18" height="44" fill="#2b2118"/><rect x="1192" y="872" width="18" height="44" fill="#2b2118"/>
    <rect x="1036" y="750" width="76" height="64" rx="8" fill="#6b5340"/>
  </g>

  <!-- low table -->
  <ellipse cx="870" cy="892" rx="190" ry="46" fill="#17130f" opacity=".35"/>
  <rect x="720" y="842" width="300" height="20" rx="4" fill="#59422f"/>
  <rect x="720" y="862" width="300" height="8" fill="#3b2b1f"/>
  <rect x="748" y="870" width="10" height="46" fill="#241a12"/><rect x="982" y="870" width="10" height="46" fill="#241a12"/>
  <rect x="820" y="828" width="48" height="14" fill="#a89680"/>
  <rect x="900" y="832" width="30" height="10" fill="#8a745c"/>

  <!-- suspended light -->
  <g>
    <path d="M870 0 V300" stroke="#8a8276" stroke-width="2"/>
    <path d="M810 340 q60 -64 120 0 z" fill="#6b5b48"/>
    <ellipse cx="870" cy="342" rx="58" ry="12" fill="#f1d3a2" opacity=".9"/>
    <circle cx="870" cy="352" r="10" fill="#ffe8c0"/>
    <ellipse cx="870" cy="360" rx="180" ry="120" fill="url(#fire)" opacity=".3"/>
  </g>

  <!-- bookcase -->
  <rect x="1270" y="430" width="160" height="310" fill="#2f261d"/>
  <g stroke="#5d4a36" stroke-width="5"><path d="M1270 500 H1430"/><path d="M1270 570 H1430"/><path d="M1270 640 H1430"/></g>
  <g fill="#8a7256">
    <rect x="1284" y="462" width="14" height="34"/><rect x="1302" y="458" width="10" height="38"/><rect x="1318" y="466" width="16" height="30"/>
    <rect x="1290" y="532" width="12" height="34"/><rect x="1310" y="528" width="10" height="38"/><rect x="1348" y="536" width="18" height="30"/>
  </g>

  <!-- foreground chair silhouette -->
  <path d="M1180 1000 L1200 860 L1380 848 L1460 1000 Z" fill="#201a14" opacity=".8"/>

  <rect width="1600" height="1000" fill="url(#vignette)"/>
  <rect width="1600" height="1000" filter="url(#grain)" opacity=".7"/>
</svg>
