<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Rooftop terrace plan — Vanguard coastal villa</title>
  <desc id="desc">Illustrative rooftop plan with timber pergola, outdoor kitchen, dining table, plunge pool and planted screens. Not to scale.</desc>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0 H0 V20" fill="none" stroke="#171916" stroke-opacity=".06" stroke-width=".6"/>
    </pattern>
    <pattern id="slats" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 9 H18" stroke="#171916" stroke-opacity=".22" stroke-width="1.4"/>
    </pattern>
    <pattern id="water" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 5 H10" stroke="#4f6f6c" stroke-opacity=".45" stroke-width=".8"/>
    </pattern>
    <style>
      .wall { fill: #171916; }
      .room { fill: none; stroke: #171916; stroke-width: 1.2; stroke-opacity: .55; }
      .label { font-family: Inter, Arial, sans-serif; font-size: 13px; letter-spacing: 2px; fill: #171916; }
      .sub { font-family: Inter, Arial, sans-serif; font-size: 10px; letter-spacing: 1.6px; fill: #6e6a62; }
      .meta { font-family: Inter, Arial, sans-serif; font-size: 10px; letter-spacing: 2.4px; fill: #6e6a62; }
      .furn { fill: none; stroke: #171916; stroke-width: 1; stroke-opacity: .45; }
      .dim { stroke: #b79a6a; stroke-width: 1; fill: none; }
    </style>
  </defs>

  <rect width="1200" height="900" fill="#f3f0e9"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <text x="80" y="70" class="label">VANGUARD ESTATES</text>
  <text x="80" y="90" class="sub">ARCHITECTURAL STUDY — COASTAL COLLECTION</text>
  <text x="1120" y="70" text-anchor="end" class="meta">LEVEL 03 / ROOFTOP</text>
  <text x="1120" y="88" text-anchor="end" class="meta">NOT TO SCALE</text>

  <rect x="300" y="230" width="620" height="420" fill="none" stroke="#171916" stroke-opacity=".18" stroke-dasharray="5 7"/>
  <rect x="340" y="260" width="520" height="380" fill="#fbf9f4"/>
  <g class="wall">
    <rect x="340" y="260" width="10" height="380"/>
    <rect x="340" y="260" width="520" height="10"/>
    <rect x="340" y="630" width="520" height="10"/>
    <rect x="850" y="260" width="10" height="380"/>
  </g>

  <!-- pergola -->
  <rect x="360" y="280" width="300" height="230" fill="url(#slats)" stroke="#171916" stroke-opacity=".5"/>
  <text x="380" y="318" class="label">PERGOLA</text>
  <text x="380" y="336" class="sub">TIMBER / 3.2 M GRID</text>
  <!-- dining -->
  <rect x="450" y="400" width="150" height="40" class="furn"/>
  <g class="furn"><rect x="460" y="446" width="14" height="12"/><rect x="494" y="446" width="14" height="12"/><rect x="528" y="446" width="14" height="12"/><rect x="562" y="446" width="14" height="12"/></g>
  <g class="furn"><rect x="460" y="384" width="14" height="12"/><rect x="494" y="384" width="14" height="12"/><rect x="528" y="384" width="14" height="12"/><rect x="562" y="384" width="14" height="12"/></g>
  <text x="524" y="488" text-anchor="middle" class="sub">DINING — 12</text>
  <!-- outdoor kitchen -->
  <rect x="680" y="290" width="160" height="62" class="furn"/>
  <text x="760" y="326" text-anchor="middle" class="sub">OUTDOOR KITCHEN</text>
  <rect x="700" y="300" width="34" height="18" class="furn"/>
  <circle cx="800" cy="304" r="9" class="furn"/>
  <!-- lounge -->
  <rect x="680" y="390" width="150" height="90" class="room"/>
  <text x="710" y="430" class="sub">LOUNGE</text>
  <rect x="700" y="440" width="90" height="26" class="furn"/>
  <!-- plunge pool -->
  <rect x="660" y="530" width="180" height="80" fill="url(#water)" stroke="#171916" stroke-opacity=".35"/>
  <text x="750" y="576" text-anchor="middle" class="sub">PLUNGE POOL</text>
  <!-- shower -->
  <rect x="370" y="544" width="70" height="66" class="room"/>
  <text x="405" y="582" text-anchor="middle" class="sub">SHOWER</text>
  <!-- planting -->
  <g fill="none" stroke="#171916" stroke-opacity=".3">
    <circle cx="392" cy="510" r="18"/><circle cx="430" cy="520" r="13"/><circle cx="482" cy="548" r="20"/><circle cx="530" cy="560" r="14"/>
    <circle cx="820" cy="480" r="16"/><circle cx="840" cy="516" r="11"/>
  </g>
  <text x="470" y="608" text-anchor="middle" class="sub">PLANTED SCREEN</text>

  <!-- roof edge / glass balustrade -->
  <g stroke="#8b9e9a" stroke-width="3">
    <path d="M360 260 H500"/><path d="M520 260 H620"/><path d="M360 630 H480"/><path d="M520 630 H620"/>
    <path d="M340 300 V380"/><path d="M340 400 V480"/>
  </g>
  <text x="760" y="680" text-anchor="middle" class="sub">GLASS BALUSTRADE TO PERIMETER</text>

  <g transform="translate(1070 250)">
    <path d="M0 24 L10 0 L20 24 L10 18 Z" fill="#171916"/>
    <text x="10" y="44" text-anchor="middle" class="meta">N</text>
  </g>
  <g transform="translate(80 800)">
    <path d="M0 0 H120" class="dim"/>
    <path d="M0 -5 V5 M60 -5 V5 M120 -5 V5" class="dim"/>
    <text x="60" y="20" text-anchor="middle" class="meta">10 M (APPROX.)</text>
  </g>
  <text x="1120" y="840" text-anchor="end" class="meta">ILLUSTRATIVE DEMONSTRATION DRAWING — NOT A SURVEY</text>
</svg>
