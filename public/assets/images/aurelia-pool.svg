<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Rooftop lap pool, Aurelia Residences</title>
  <desc id="desc">Stylised night view of a rooftop lap pool and planted garden with a lit pavilion and the harbour beyond.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111823"/>
      <stop offset=".55" stop-color="#2b3644"/>
      <stop offset=".82" stop-color="#5f6066"/>
      <stop offset="1" stop-color="#8b7a6b"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16262b"/>
      <stop offset=".5" stop-color="#0e1c20"/>
      <stop offset="1" stop-color="#081113"/>
    </linearGradient>
    <linearGradient id="pool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3e8f8c"/>
      <stop offset=".4" stop-color="#2a7472"/>
      <stop offset="1" stop-color="#154846"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d7567"/>
      <stop offset="1" stop-color="#3e3a33"/>
    </linearGradient>
    <radialGradient id="warm" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd9a2" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#f0b06b" stop-opacity=".35"/>
      <stop offset="1" stop-color="#f0b06b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".45" r=".8">
      <stop offset=".45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#03070a" stop-opacity=".68"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".06"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <g fill="#cdd6dd" opacity=".55">
    <circle cx="180" cy="140" r="2"/><circle cx="420" cy="90" r="1.5"/><circle cx="700" cy="160" r="1.6"/><circle cx="980" cy="110" r="2"/>
    <circle cx="1240" cy="190" r="1.6"/><circle cx="1480" cy="120" r="2"/><circle cx="300" cy="240" r="1.2"/><circle cx="1120" cy="280" r="1.2"/>
  </g>

  <!-- distant city / harbour -->
  <rect y="520" width="1600" height="90" fill="#1a2229"/>
  <g fill="#2c3740">
    <rect x="80" y="466" width="40" height="60"/><rect x="130" y="440" width="26" height="86"/><rect x="210" y="480" width="60" height="46"/>
    <rect x="420" y="450" width="30" height="76"/><rect x="470" y="472" width="52" height="54"/><rect x="700" y="430" width="34" height="96"/>
    <rect x="760" y="462" width="60" height="64"/><rect x="1120" y="446" width="40" height="80"/><rect x="1190" y="474" width="70" height="52"/>
    <rect x="1350" y="452" width="30" height="74"/><rect x="1440" y="430" width="46" height="96"/>
  </g>
  <g fill="#f3c98e" opacity=".55">
    <rect x="140" y="470" width="6" height="8"/><rect x="152" y="490" width="6" height="8"/><rect x="430" y="480" width="6" height="8"/>
    <rect x="712" y="460" width="6" height="8"/><rect x="716" y="486" width="6" height="8"/><rect x="1132" y="472" width="6" height="8"/>
    <rect x="1452" y="460" width="6" height="8"/><rect x="1464" y="484" width="6" height="8"/>
  </g>
  <rect y="610" width="1600" height="100" fill="url(#water)"/>
  <g stroke="#e0c7a4" stroke-width="1.2" opacity=".18">
    <path d="M0 640 H1600"/><path d="M0 676 H1600"/><path d="M0 716 H1600"/>
  </g>
  <g fill="#ffcf95" opacity=".45">
    <rect x="150" y="640" width="30" height="2"/><rect x="440" y="664" width="40" height="2"/><rect x="720" y="636" width="26" height="2"/>
    <rect x="1140" y="670" width="34" height="2"/><rect x="1460" y="648" width="30" height="2"/>
  </g>

  <!-- roof garden -->
  <path d="M0 700 L1600 690 L1600 1000 L0 1000 Z" fill="url(#deck)"/>
  <g stroke="#5c564b" stroke-width="2" opacity=".5">
    <path d="M0 762 H1600"/><path d="M0 832 H1600"/><path d="M0 910 H1600"/><path d="M0 976 H1600"/>
  </g>

  <!-- planting beds -->
  <g fill="#1c2a22">
    <path d="M0 700 C160 690 260 730 300 1000 L0 1000 Z"/>
    <path d="M1600 694 C1460 690 1370 740 1350 1000 L1600 1000 Z"/>
  </g>
  <g fill="#2e4434">
    <ellipse cx="180" cy="760" rx="120" ry="46"/><ellipse cx="250" cy="840" rx="90" ry="38"/>
    <ellipse cx="1440" cy="770" rx="120" ry="46"/><ellipse cx="1380" cy="860" rx="80" ry="34"/>
  </g>

  <!-- pavilion -->
  <rect x="980" y="470" width="480" height="240" fill="#242b28"/>
  <rect x="980" y="452" width="500" height="22" fill="#3a4039"/>
  <rect x="1006" y="516" width="200" height="130" fill="#f6c487" opacity=".5"/>
  <g fill="#20251f">
    <rect x="1000" y="500" width="8" height="210"/><rect x="1100" y="500" width="8" height="210"/><rect x="1200" y="500" width="8" height="210"/>
  </g>
  <ellipse cx="1110" cy="600" rx="300" ry="160" fill="url(#warm)" opacity=".35"/>
  <rect x="1280" y="612" width="140" height="12" fill="#5e4a35"/>
  <g fill="#8a6c4b"><rect x="1300" y="624" width="8" height="50"/><rect x="1392" y="624" width="8" height="50"/></g>

  <!-- lap pool -->
  <rect x="330" y="740" width="900" height="190" rx="6" fill="#20302f"/>
  <rect x="344" y="754" width="872" height="162" rx="4" fill="url(#pool)"/>
  <g stroke="#c8eee9" stroke-width="1.6" opacity=".28">
    <path d="M380 790 H1170"/><path d="M410 830 H1200"/><path d="M440 872 H1210"/><path d="M470 912 H1220"/>
  </g>
  <g fill="#ffe0b3" opacity=".5">
    <rect x="1060" y="786" width="120" height="3"/><rect x="1020" y="826" width="100" height="3"/>
  </g>
  <rect x="330" y="730" width="900" height="12" fill="#c9b99f"/>
  <!-- pool steps -->
  <g fill="#3c7f7c">
    <rect x="370" y="756" width="80" height="14"/><rect x="370" y="774" width="60" height="12"/><rect x="370" y="790" width="40" height="10"/>
  </g>

  <!-- loungers -->
  <g fill="#2a2d27">
    <rect x="640" y="690" width="120" height="18" rx="4"/><rect x="640" y="708" width="12" height="30"/><rect x="748" y="708" width="12" height="30"/>
    <rect x="800" y="686" width="120" height="18" rx="4"/><rect x="800" y="704" width="12" height="30"/><rect x="908" y="704" width="12" height="30"/>
  </g>

  <!-- landscape lights -->
  <g fill="#ffd9a2">
    <circle cx="330" cy="722" r="4"/><circle cx="500" cy="720" r="3"/><circle cx="1280" cy="718" r="3.5"/><circle cx="1500" cy="730" r="3"/>
    <circle cx="360" cy="948" r="3"/><circle cx="1230" cy="946" r="3"/>
  </g>

  <rect width="1600" height="1000" fill="url(#vignette)"/>
  <rect width="1600" height="1000" filter="url(#grain)" opacity=".7"/>
</svg>
